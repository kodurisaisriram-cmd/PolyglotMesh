spring:
  application:
    name: polyglot-webflux
  main:
    web-application-type: reactive
    banner-mode: console

server:
  port: 8080
  address: 127.0.0.1
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

polyglot:
  engine:
    default-timeout-ms: 10000
    max-timeout-ms: 60000
    max-code-length: 65536
    supported-languages:
      - python
      - js

logging:
  level:
    root: INFO
    com.polyglotmesh.webflux: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
